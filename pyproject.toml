[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymarc-dedupe"
version = "0.1.0"
description = "MARC record normalization and deduplication using machine learning and the GoldRush algorithm"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Max Kadel", email = "mkadel@gmail.com" },
]
keywords = ["marc", "library", "deduplication", "bibliographic", "goldrush"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "pymarc>=5.0",
    "unidecode>=1.3",
    "dedupe>=2.0",
    "ijson>=3.0",
]

[project.optional-dependencies]
postgres = ["psycopg2>=2.9"]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-env",
    "ruff",
    "pylint",
    "coveralls",
    "coverage",
    "psycopg2>=2.9",
]

[project.urls]
Homepage = "https://github.com/pulibrary/pymarc_dedupe"
Repository = "https://github.com/pulibrary/pymarc_dedupe"
Issues = "https://github.com/pulibrary/pymarc_dedupe/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymarc_dedupe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pytest_env]
# Uncomment the line below for local testing
# ENV_FOR_DYNACONF = "local_test"

[tool.ruff]
exclude = [".venv", ".cci_pycache"]
